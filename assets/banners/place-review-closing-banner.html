<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .banner{
    width:700px; height:210px;
    display:flex; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    overflow:hidden;
  }
  .left{
    width:250px; height:210px; background:#ffffff;
    display:flex; align-items:center; justify-content:center;
  }
  .right{
    flex:1; height:210px;
    background:linear-gradient(100deg,#ff6a8f 0%, #ff7f6b 40%, #ffa652 75%, #ffbb5c 100%);
    display:flex; flex-direction:column; justify-content:center;
    padding:0 40px; color:#ffffff; box-sizing:border-box;
  }
  .kicker{ font-size:19px; font-weight:700; margin-bottom:16px; letter-spacing:-0.3px; }
  .badge{
    display:inline-flex; align-items:center; gap:10px;
    border:2px solid #ffffff; border-radius:6px;
    padding:7px 16px; width:fit-content; margin-bottom:14px;
  }
  .nlogo{
    width:20px; height:20px; border-radius:50%; background:#ffffff;
    color:#ff7a45; font-weight:900; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .sep{ opacity:.6; }
  .account{ font-size:19px; font-weight:700; }
  .footer{ font-size:14px; opacity:.95; }
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <svg width="240" height="210" viewBox="0 8 230 178" preserveAspectRatio="xMidYMid slice">
        <!-- pumpkin stem -->
        <path d="M62,18 C60,8 66,2 72,4 C78,6 76,16 74,22 Z" fill="#7c5a35"/>
        <!-- pumpkin body -->
        <ellipse cx="65" cy="110" rx="58" ry="56" fill="#f9800e"/>
        <ellipse cx="65" cy="110" rx="58" ry="56" fill="url(#pumpkinShade)"/>
        <!-- pumpkin eyes -->
        <g transform="translate(38,104)">
          <circle r="15" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
          <circle cx="4" cy="3" r="7" fill="#222"/>
        </g>
        <g transform="translate(72,106)">
          <circle r="15" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
          <circle cx="-3" cy="4" r="7" fill="#222"/>
        </g>

        <!-- squash stem -->
        <path d="M156,10 C154,2 162,-3 168,1 C173,5 170,16 166,20 Z" fill="#7c5a35" transform="translate(0,6)"/>
        <!-- butternut squash body: narrow neck, bulbous bottom -->
        <path d="M160,20
                 C148,20 142,34 145,48
                 C126,62 116,88 116,116
                 C116,152 138,178 168,178
                 C198,178 216,152 214,118
                 C213,90 202,64 184,48
                 C186,34 172,20 160,20 Z"
              fill="#f2dfae"/>
        <path d="M160,20
                 C148,20 142,34 145,48
                 C126,62 116,88 116,116
                 C116,152 138,178 168,178
                 C198,178 216,152 214,118
                 C213,90 202,64 184,48
                 C186,34 172,20 160,20 Z"
              fill="url(#squashShade)"/>
        <!-- squash eyes -->
        <g transform="translate(148,108)">
          <circle r="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
          <circle cx="4" cy="3" r="6.5" fill="#222"/>
        </g>
        <g transform="translate(178,110)">
          <circle r="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
          <circle cx="-3" cy="4" r="6.5" fill="#222"/>
        </g>

        <defs>
          <radialGradient id="pumpkinShade" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffb35c" stop-opacity="0.9"/>
            <stop offset="55%" stop-color="#f9800e" stop-opacity="0"/>
            <stop offset="100%" stop-color="#d9600a" stop-opacity="0.35"/>
          </radialGradient>
          <radialGradient id="squashShade" cx="38%" cy="20%" r="80%">
            <stop offset="0%" stop-color="#fbf1d8" stop-opacity="0.9"/>
            <stop offset="55%" stop-color="#f2dfae" stop-opacity="0"/>
            <stop offset="100%" stop-color="#dcb977" stop-opacity="0.35"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <div class="right">
      <div class="kicker">푸드 전문블로거</div>
      <div class="badge">
        <div class="nlogo">N</div>
        <span class="sep">|</span>
        <span class="account">@ 링키징키</span>
      </div>
      <div class="footer">네이버에서 검색하고 🙂 팬하기</div>
    </div>
  </div>
</body>
</html>
