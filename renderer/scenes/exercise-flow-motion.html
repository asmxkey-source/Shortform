<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Pretendard;font-weight:900;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Black.woff2)}
@font-face{font-family:Pretendard;font-weight:700;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2)}
@font-face{font-family:Pretendard;font-weight:500;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2)}
html,body{margin:0;background:#0B0F14}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../common.js"></script>
<script>
// ── 템플릿 B (시각 몰입형) · 21초 · 컨셉: "흐르는 선" ──
// 선 다발 = 몸의 움직임. 새로움(크게 출렁임) → 익숙함(같은 고리를 맴돎)
// → 이탈(한 줄이 고리를 벗어남) → 쉼(거의 멈춤) → 다시 흐름 → 첫 프레임 구도로 루프
const ctx = document.getElementById('c').getContext('2d');
const W = 1080, H = 1920, CX = 540, CY = 930;
const N = 26, P = 110;
const PAL = ['#4FD1C5', '#63B3ED', '#B794F4', '#F6AD55', '#F56565'];
const ACC = '#FF7A59';

const K = {
  amp:    [[0,120],[2,230],[3.5,260],[5,170],[6.5,60],[9,50],[11,30],[12.5,10],[16,10],[17,130],[18.5,150],[21,120]],
  spread: [[0,520],[2,720],[5,720],[7,520],[11,520],[12.5,640],[16,640],[17.5,520],[21,520]],
  speed:  [[0,1.1],[1.9,1.4],[2.1,2.6],[5,1.6],[7.5,2.2],[9,2.8],[10.5,0.9],[12,0.04],[16,0.04],[16.8,1.5],[21,1.1]],
  ring:   [[0,0],[5,0],[6.6,1],[9.4,1],[11.4,0]],
  ringR:  [[5,320],[7.5,300],[9.2,210]],
  ringW:  [[5,260],[7.5,170],[9.2,90]],
  brk:    [[9.0,0],[9.9,1],[11.4,1],[12,0]],
  mono:   [[0,0],[5.2,0],[7.2,0.9],[9.6,0.9],[11.5,0.35],[16,0.5],[16.8,0],[21,0]],
  alpha:  [[0,0.8],[11,0.8],[12.5,0.32],[16,0.32],[16.8,0.85],[21,0.8]],
  zoom:   [[0,1.0],[0.99,1.05],[1.0,1.16],[1.99,1.08],[2.0,1.0],[9.0,1.0],[9.35,1.28],[10.6,1.12],[11.6,1.0],[21,1.0]],
  rot:    [[0,0],[5,0],[9.2,3.4],[11.4,4.4]],
};
const P_ = name => t => kf(K[name], t);

// 위상 = ∫speed dt (결정적 누적 테이블)
const DT = 1 / 240, PH = [0];
for (let i = 1; i <= 22 / DT; i++) PH.push(PH[i - 1] + kf(K.speed, i * DT) * DT);
const phaseAt = t => PH[Math.min(PH.length - 1, Math.round(t / DT))];
const ringPhAt = t => kf(K.rot, t, k => k);

function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, k) { return a.map((v, i) => Math.round(lerp(v, b[i], k))); }
function palAt(u) {
  const x = u * (PAL.length - 1), i = Math.min(PAL.length - 2, Math.floor(x));
  return mix(hex(PAL[i]), hex(PAL[i + 1]), x - i);
}
const GREY = [120, 130, 145];

function flash(t) {
  let f = 0;
  for (const [s, a] of [[1.0, 0.18], [2.0, 0.32], [9.2, 0.45], [16.8, 0.15]]) if (t >= s) f += a * Math.exp(-(t - s) * 9);
  return f;
}

function drawLines(t) {
  const amp = kf(K.amp, t), spread = kf(K.spread, t), ph = phaseAt(t);
  const ring = kf(K.ring, t), R = kf(K.ringR, t), RW = kf(K.ringW, t), brk = kf(K.brk, t);
  const mono = kf(K.mono, t), alpha = kf(K.alpha, t), rph = ringPhAt(t);
  const kBrk = Math.floor(N / 2);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1);
    const isB = i === kBrk;
    // 선마다 약간씩 늦게 고리로 말려 들어감
    const delay = u * 0.35;
    let m = clamp((ring - delay) / (1 - 0.35 + 1e-6));
    m = ease.inOut(clamp(ring * 1.0 > 0.999 ? 1 : m));
    if (isB) m = m * (1 - ease.inOut(brk));
    let col = palAt(u);
    col = mix(col, GREY, mono * (isB ? 0 : 1));
    if (isB && brk > 0) col = mix(col, hex(ACC), brk);
    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${isB && brk > 0 ? Math.max(alpha, 0.95) : alpha})`;
    ctx.lineWidth = isB ? lerp(3, 10, brk) : 3;
    if (isB && brk > 0) { ctx.shadowColor = ACC; ctx.shadowBlur = 30 * brk; } else ctx.shadowBlur = 0;
    ctx.beginPath();
    for (let j = 0; j < P; j++) {
      const s = j / (P - 1);
      const x = -60 + s * (W + 120);
      const by = CY + (u - 0.5) * spread;
      const wy = by + amp * (0.62 * Math.sin(x * 0.0062 + ph * 1.0 + u * 3.1) + 0.38 * Math.sin(x * 0.0029 - ph * 0.7 + u * 5.3));
      let px = x, py = wy;
      if (isB && brk > 0) py = wy + brk * 220 * Math.sin(s * 9 + ph * 2) * (1 - Math.abs(s - 0.5));
      if (m > 0) {
        const th = s * Math.PI * 2 + rph + u * 0.4;
        const r = R + (u - 0.5) * RW + 14 * Math.sin(3 * th + ph);
        const rx = CX + r * Math.cos(th), ry = CY + r * Math.sin(th);
        px = lerp(px, rx, m); py = lerp(py, ry, m);
      }
      j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}

// 쉼 구간: 떠다니는 먼지 입자
function drawDust(t) {
  const a = kf([[11,0],[12.5,1],[16,1],[17,0]], t);
  if (a <= 0) return;
  for (let i = 0; i < 70; i++) {
    const sx = (Math.sin(i * 91.7) * 0.5 + 0.5) * W;
    const sy = (Math.sin(i * 47.3) * 0.5 + 0.5) * H;
    const y = sy - ((t * 14 + i * 7) % 60);
    ctx.fillStyle = `rgba(255,236,210,${0.35 * a * (0.4 + 0.6 * (Math.sin(i + t) * 0.5 + 0.5))})`;
    ctx.beginPath(); ctx.arc(sx + 8 * Math.sin(t * 0.6 + i), y, 1.6 + (i % 3), 0, Math.PI * 2); ctx.fill();
  }
}

function scrim(top, bottom) {
  if (top > 0) {
    const g = ctx.createLinearGradient(0, 180, 0, 640);
    g.addColorStop(0, `rgba(11,15,20,${0.85 * top})`); g.addColorStop(1, 'rgba(11,15,20,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 180, W, 460);
  }
  if (bottom > 0) {
    const g = ctx.createLinearGradient(0, 1140, 0, 1680);
    g.addColorStop(0, 'rgba(11,15,20,0)'); g.addColorStop(0.45, `rgba(11,15,20,${0.8 * bottom})`); g.addColorStop(1, `rgba(11,15,20,${0.9 * bottom})`);
    ctx.fillStyle = g; ctx.fillRect(0, 1140, W, 540);
  }
}

const WHITE = '#FFFFFF', DIM = '#C9D3DD';
// 본문 자막(lower_safe: 하단 기준 y=1540)
const BODY = [
  { s: 2.0, e: 3.5, lines: [[{ text: '처음엔, 모든 게 새롭다', color: WHITE }]] },
  { s: 3.5, e: 5.0, lines: [[{ text: '변화가 ', color: WHITE }, { text: '잘 느껴진다', color: '#F6AD55' }]] },
  { s: 5.0, e: 7.5, lines: [[{ text: '익숙해지면,', color: DIM }], [{ text: '원래 방식으로 돌아간다', color: WHITE }]] },
  { s: 7.5, e: 9.0, lines: [[{ text: '같은 힘 · 같은 방향 · 같은 버팀', color: WHITE }]] },
  { s: 9.0, e: 11.0, lines: [[{ text: '한 번씩, ', color: WHITE }, { text: '패턴 밖으로', color: ACC }]] },
  { s: 11.0, e: 13.5, lines: [[{ text: '그리고, 쉬기', color: WHITE }], [{ text: '아무것도 하지 않는 시간도', color: DIM }]] },
  { s: 13.5, e: 16.0, lines: [[{ text: '정답도, 완성도 없다', color: WHITE }]] },
];

function drawText(t) {
  // 훅 (top_safe, 0~2초)
  const hookOn = visible(t, 0, 2.0);
  const bodyOn = BODY.some(b => visible(t, b.s, b.e)) || visible(t, 16, 18.5);
  scrim(hookOn ? 1 - prog(t, 1.75, 0.25) : 0, bodyOn ? 1 : 0);
  if (hookOn) {
    drawLine(ctx, [{ text: '완벽한 운동은', color: WHITE }], CX, 390, { t, start: 0.05, end: 2.0, size: 86, stagger: 0.03 });
    drawLine(ctx, [{ text: '없다', color: ACC }], CX, 500, { t, start: 1.0, end: 2.0, size: 96, stagger: 0.08, rise: 50 });
  }
  for (const b of BODY) {
    if (!visible(t, b.s, b.e)) continue;
    const n = b.lines.length;
    b.lines.forEach((ln, i) => {
      const y = 1540 - (n - 1 - i) * 80;
      drawLine(ctx, ln, CX, y, { t, start: b.s + 0.05 + i * 0.12, end: b.e, size: i === n - 1 ? 60 : 50, weight: i === n - 1 ? 900 : 700 });
    });
  }
  // 세 동사가 차례로 (16~18.5)
  if (visible(t, 16, 18.5)) {
    const words = [['알아차리고', '#4FD1C5', 16.05], ['다르게 해보고', '#B794F4', 16.75], ['쉬고', '#F6AD55', 17.45]];
    ctx.font = '900 58px Pretendard';
    const sep = '  ·  ';
    const total = words.reduce((a, w) => a + ctx.measureText(w[0]).width, 0) + ctx.measureText(sep).width * 2;
    let x = CX - total / 2;
    words.forEach(([w, c, s], i) => {
      drawLine(ctx, [{ text: w, color: c }], x, 1540, { t, start: s, end: 18.5, size: 58, align: 'left' });
      x += ctx.measureText(w).width;
      if (i < 2) { drawLine(ctx, [{ text: sep, color: DIM }], x, 1540, { t, start: s + 0.3, end: 18.5, size: 58, align: 'left', weight: 500 }); ctx.font = '900 58px Pretendard'; x += ctx.measureText(sep).width; }
    });
  }
  // CTA (cta_center, 18.5~21)
  if (t >= 18.5) {
    const a = ease.out(prog(t, 18.5, 0.4)) * (1 - prog(t, 20.75, 0.25));
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(11,15,20,0.62)';
    roundRect(110, 770, 860, 380, 36); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    drawLine(ctx, [{ text: '완성된 몸이 아니라', color: DIM }], CX, 900, { t, start: 18.6, end: 21, size: 52, weight: 700 });
    drawLine(ctx, [{ text: '흘러가는 몸', color: WHITE }], CX, 1000, { t, start: 18.85, end: 21, size: 72, stagger: 0.05 });
    drawLine(ctx, [{ text: '그러다, 또 움직이기', color: ACC }], CX, 1086, { t, start: 19.4, end: 21, size: 40, weight: 700, shadow: false });
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

window.renderFrame = function (t) {
  // 배경: 장면마다 은은한 색 온도 변화
  const warm = kf([[0,0],[2,0.6],[5,0.4],[7,0],[11,0],[12.5,0.8],[16,0.8],[17,0.2],[21,0]], t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0B0F14'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, CY, 50, CX, CY, 1100);
  g.addColorStop(0, `rgba(${Math.round(lerp(40, 70, warm))},${Math.round(lerp(60, 45, warm))},${Math.round(lerp(90, 40, warm))},0.9)`);
  g.addColorStop(1, 'rgba(11,15,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const z = kf(K.zoom, t);
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(z, z); ctx.translate(-CX, -CY);
  drawLines(t);
  ctx.restore();
  drawDust(t);
  drawText(t);
  const f = flash(t);
  if (f > 0.002) { ctx.fillStyle = `rgba(255,245,235,${f})`; ctx.fillRect(0, 0, W, H); }
};
(async () => { await Promise.all(['900 80px Pretendard', '700 50px Pretendard', '500 50px Pretendard'].map(f => document.fonts.load(f))); window.renderFrame(0); window.__ready = true; })();
</script></body></html>
